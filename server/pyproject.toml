[project]
name = "querybot-server"
version = "0.1.0"
description = "QueryBot FastAPI Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.38",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.1.2",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "langgraph-sdk>=0.2.9",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
